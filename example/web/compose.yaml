# Preview stack for the production server image (server/Dockerfile).
# Run from this file's own directory (the repo root, whether this repo is
# cloned standalone or checked out as the example/web submodule):
#
#   docker compose up --build
#
# The client is build-only (see client/Dockerfile) and isn't served by
# anything here -- build it directly instead:
#   docker build -f client/Dockerfile ./client
#
# For day-to-day development, run the client and server directly from
# source instead (see Makefile) -- no Docker involved.

services:
    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        ports:
            - "8787:8787"
