# Preview stack for the production server image (server/Dockerfile).
#
#   docker compose -f example/web/compose.yaml up --build
#
# The client is build-only (see client/Dockerfile) and isn't served by
# anything here -- build it directly instead (from the repo root):
#   docker build -f example/web/client/Dockerfile .
#
# For day-to-day development, run the client and server directly from
# source instead (see Makefile) -- no Docker involved.

services:
    server:
        build:
            context: ../..
            dockerfile: example/web/server/Dockerfile
        ports:
            - "8787:8787"
