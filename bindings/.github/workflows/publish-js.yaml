name: Publish @godexture/js

# js/ and wasm/ aren't go-gettable dependencies of anything (wasm/ builds
# only a main package, consumed only inside this repo), so this repo's
# existing v* tags don't carry npm-publish meaning. js releases use their
# own tag namespace instead. The tag is the single source of truth for the
# published version -- js/package.json's version is set from it below, so
# no manual version bump is needed before tagging.
on:
  push:
    tags:
      - "js/v*.*.*"

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit version bump
        working-directory: js
        run: |
          version="${GITHUB_REF_NAME#js/v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          if git diff --quiet -- package.json; then
            echo "package.json already at $version, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(js): bump version to $version"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  build:
    needs: bump-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: wasm/go.mod

      - name: Install tinygo
        run: |
          curl -fsSL -o /tmp/tinygo.deb \
            https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb
          sudo dpkg -i /tmp/tinygo.deb || sudo apt-get install -f -y

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build
        working-directory: js
        env:
          GOWORK: "off"
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: js-dist
          path: js/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: js-dist
          path: js/dist

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: js
        run: npm publish --provenance --access public
